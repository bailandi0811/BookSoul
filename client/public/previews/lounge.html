<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>书友客厅 · 预览</title>
    <style>
      :root {
        --ink: #1a242c;
        --paper: #f6f3ec;
        --tide: #243848;
        --dusk: #5d7282;
        --lamp: #c6a15a;
        --mist: rgba(246, 243, 236, 0.9);
        --song: "Songti SC", "STSong", "SimSun", "NSimSun", serif;
        --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        min-height: 100%;
        color: var(--ink);
        font-family: var(--sans);
        background: url("/backgrounds/coast.webp") center / cover no-repeat fixed;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(20, 32, 42, 0.16), transparent 14%),
          linear-gradient(
            180deg,
            transparent 48%,
            rgba(246, 243, 236, 0.28) 70%,
            rgba(246, 243, 236, 0.62)
          );
      }

      button,
      textarea {
        font: inherit;
        color: inherit;
      }

      button {
        border: 0;
        background: none;
        cursor: pointer;
      }

      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--lamp);
        outline-offset: 3px;
      }

      .halo {
        text-shadow:
          0 0 16px rgba(246, 243, 236, 0.95),
          0 1px 0 rgba(246, 243, 236, 0.8);
      }

      .top,
      .room {
        position: relative;
        z-index: 1;
      }

      .top {
        max-width: 1360px;
        width: calc(100% - 64px);
        height: 84px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .capsule {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(44, 44, 41, 0.14);
        background: rgba(251, 251, 249, 0.92);
        border-radius: 30px;
      }

      .brand {
        gap: 12px;
        padding: 10px 16px;
      }

      .brand b {
        font-family: Georgia, var(--song);
        font-weight: 400;
        font-size: 22px;
        letter-spacing: -0.6px;
      }

      .brand span {
        margin-left: 4px;
        padding-left: 14px;
        border-left: 1px solid rgba(44, 44, 41, 0.16);
        font-size: 12px;
        color: #666661;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav {
        height: 40px;
        padding: 0 14px;
        gap: 8px;
        font-size: 13px;
      }

      .nav.here {
        background: rgba(36, 56, 72, 0.92);
        color: var(--paper);
        border-color: transparent;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
      }

      .who {
        gap: 8px;
        padding: 4px 12px 4px 4px;
        font-size: 13px;
      }

      .face {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        background: #d7e0e6;
        color: var(--tide);
        font-family: var(--song);
        font-size: 15px;
        border: 2px solid rgba(246, 243, 236, 0.92);
        box-shadow: 0 6px 14px rgba(26, 36, 44, 0.16);
      }

      .face.chen {
        background: #d5e2ea;
      }

      .face.brandy {
        background: #eadfce;
        color: #6d5430;
      }

      .room {
        width: min(760px, calc(100% - 40px));
        height: calc(100% - 84px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .room-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        padding: 6px 8px 0;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        font-size: 12px;
        color: var(--dusk);
      }

      h1 {
        margin: 10px 0 0;
        font-family: var(--song);
        font-weight: 400;
        font-size: 44px;
        letter-spacing: 0.08em;
        line-height: 1.1;
      }

      .lede {
        margin: 8px 0 0;
        font-family: var(--song);
        font-size: 15px;
        color: var(--ink);
      }

      .lede::after {
        content: "";
        display: block;
        width: 36px;
        height: 2px;
        margin-top: 12px;
        background: var(--tide);
      }

      .presence {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        padding: 5px 12px 5px 5px;
        border-radius: 2px;
        background: rgba(246, 243, 236, 0.88);
        box-shadow: 0 10px 22px rgba(26, 36, 44, 0.12);
      }

      .presence small {
        font-family: var(--song);
        font-size: 16px;
      }

      .live {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--song);
        font-size: 15px;
        color: var(--ink);
      }

      .live i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lamp);
        box-shadow: 0 0 0 4px rgba(198, 161, 90, 0.28);
      }

      .thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        padding: 20px 8px 12px;
        scrollbar-width: none;
      }

      .thread::-webkit-scrollbar {
        display: none;
      }

      .talk {
        position: relative;
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 22px 16px 30px;
      }

      .talk > * {
        position: relative;
        z-index: 1;
      }

      .day {
        align-self: flex-start;
        margin: 0 0 -8px 42px;
        font-family: var(--song);
        font-size: 13px;
        color: var(--dusk);
      }

      .line {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 10px;
        max-width: min(460px, 100%);
        animation: settle 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .line:nth-child(2) {
        animation-delay: 0.04s;
      }
      .line:nth-child(3) {
        animation-delay: 0.1s;
      }
      .line:nth-child(4) {
        animation-delay: 0.16s;
      }
      .line:nth-child(5) {
        animation-delay: 0.22s;
      }

      .line.follow {
        z-index: 2;
        margin-top: -24px;
      }

      .line.mine {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .line .face {
        position: relative;
        z-index: 3;
        align-self: flex-start;
        margin-top: 22px;
      }

      .line.mine .face {
        margin-left: -8px;
      }

      .line:not(.mine) .face {
        margin-right: -8px;
      }

      .line.follow .face,
      .spacer {
        visibility: hidden;
      }

      .spoken {
        min-width: 0;
      }

      .who-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 2px 6px;
      }

      .mine .who-line {
        flex-direction: row-reverse;
      }

      .who-line strong {
        font-family: var(--song);
        font-weight: 400;
        font-size: 15px;
      }

      .who-line time {
        font-size: 12px;
        color: var(--dusk);
      }

      .slip {
        width: fit-content;
        max-width: 100%;
        margin: 0;
        padding: 10px 14px 11px;
        border-radius: 2px;
        background: rgba(246, 243, 236, 0.94);
        box-shadow: 0 8px 16px rgba(26, 36, 44, 0.08);
        font-size: 16px;
        line-height: 1.7;
      }

      .line.follow .slip {
        box-shadow: 0 14px 22px rgba(26, 36, 44, 0.16);
      }

      .mine .slip {
        margin-left: auto;
        padding: 10px 16px 11px;
        background: var(--tide);
        color: var(--paper);
        box-shadow: 0 18px 32px rgba(20, 32, 42, 0.28);
      }

      .mine.follow .slip {
        box-shadow: 0 18px 28px rgba(20, 32, 42, 0.34);
      }

      .quote {
        display: block;
        margin: 0 0 8px;
        padding: 6px 8px 6px 10px;
        border-left: 2px solid rgba(246, 243, 236, 0.45);
        background: rgba(12, 22, 30, 0.28);
        color: rgba(246, 243, 236, 0.78);
        font-size: 13px;
        line-height: 1.55;
      }

      .quote b {
        display: block;
        font-weight: 500;
        color: rgba(246, 243, 236, 0.92);
      }

      .reply {
        position: absolute;
        left: 42px;
        margin-top: 2px;
        padding: 0;
        font-family: var(--song);
        font-size: 13px;
        color: var(--ink);
        opacity: 0;
      }

      .spoken {
        position: relative;
      }

      .mine .reply {
        left: auto;
        right: 0;
        color: var(--ink);
      }

      .line:hover .reply,
      .line:focus-within .reply {
        opacity: 1;
      }

      .sill {
        position: relative;
        z-index: 4;
        margin: -22px -12px 22px;
      }

      .tray {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 4px 8px 8px 16px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        background: rgba(246, 243, 236, 0.96);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 22px 40px rgba(20, 32, 42, 0.28);
      }

      .tray-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      textarea {
        flex: 1;
        min-height: 44px;
        max-height: 120px;
        resize: none;
        border: 0;
        padding: 10px 0;
        background: transparent;
        font-size: 15px;
        line-height: 1.6;
      }

      textarea:focus-visible {
        outline: none;
      }

      .tray:focus-within {
        box-shadow:
          0 0 0 2px var(--lamp),
          0 16px 40px rgba(26, 36, 44, 0.14);
      }

      .send {
        height: 40px;
        padding: 0 16px;
        border-radius: 2px;
        background: var(--tide);
        color: var(--paper);
        font-family: var(--song);
        font-size: 16px;
      }

      .send:disabled {
        cursor: default;
      }

      .sill-note {
        display: flex;
        justify-content: space-between;
        margin: 0 6px 8px;
        font-size: 12px;
        color: var(--dusk);
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .line {
          animation: none;
        }

        .live i {
          box-shadow: none;
        }
      }

      @media (max-width: 720px) {
        .top {
          width: calc(100% - 24px);
          height: auto;
          min-height: 72px;
          padding: 12px 0;
        }

        .brand span,
        .nav span,
        .who em {
          display: none;
        }

        h1 {
          font-size: 34px;
        }

        .room {
          width: calc(100% - 24px);
          height: calc(100% - 88px);
        }

        .presence small {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="capsule brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v16H7.5A3.5 3.5 0 0 0 4 21.5V5.5Z" stroke="#1a242c" stroke-width="1.4"/>
          <path d="M4 19.2A3.5 3.5 0 0 1 7.5 16H20" stroke="#1a242c" stroke-width="1.4"/>
        </svg>
        <b>BookSoul</b>
        <span>书友客厅</span>
      </div>
      <div class="actions">
        <button class="capsule nav here" type="button">书友客厅</button>
        <button class="capsule nav" type="button">心绪塔罗</button>
        <button class="capsule nav" type="button">背景</button>
        <button class="capsule icon-btn" type="button" aria-label="切换明暗">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="#1a242c" stroke-width="1.5"/>
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" stroke="#1a242c" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="capsule who">
          <span class="face brandy">B</span>
          <em>Brandy</em>
        </div>
      </div>
    </header>

    <main class="room">
      <div class="room-head">
        <div>
          <button class="back" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            返回书库
          </button>
          <h1 class="halo">书友客厅</h1>
          <p class="lede halo">书页之外，也有故事。</p>
        </div>
        <div class="presence">
          <span class="face chen" aria-hidden="true">陈</span>
          <div>
            <div class="live"><i></i>Chen 在座</div>
          </div>
        </div>
      </div>

      <div class="thread" aria-label="书友公共聊天">
        <div class="talk">
        <p class="day">十月五日</p>

        <article class="line">
          <span class="face chen">陈</span>
          <div class="spoken">
            <p class="who-line"><strong>Chen</strong><time>15:44</time></p>
            <p class="slip">你好</p>
            <button class="reply halo" type="button">回复</button>
          </div>
        </article>

        <article class="line follow">
          <span class="face chen spacer">陈</span>
          <div class="spoken">
            <p class="slip">这章的雨写得太安静了，读完没立刻翻下一页。</p>
            <button class="reply halo" type="button">回复</button>
          </div>
        </article>

        <article class="line mine">
          <span class="face brandy">B</span>
          <div class="spoken">
            <p class="who-line"><strong>Brandy</strong><time>15:46</time></p>
            <div class="slip">
              <span class="quote"><b>Chen</b>这章的雨写得太安静了</span>
              我也停住了。窗还开着。
            </div>
            <button class="reply halo" type="button">回复</button>
          </div>
        </article>

        <article class="line mine follow">
          <span class="face brandy spacer">B</span>
          <div class="spoken">
            <p class="slip">了解了</p>
            <button class="reply halo" type="button">回复</button>
          </div>
        </article>
        </div>
      </div>

      <form class="sill" action="#" onsubmit="return false">
        <div class="tray">
          <div class="tray-row">
            <textarea rows="1" placeholder="把读完的心情放在这里" aria-label="消息"></textarea>
            <button class="send" type="submit" disabled>发送</button>
          </div>
          <div class="sill-note">
            <span>按 Enter 发送</span>
            <span>0/2000</span>
          </div>
        </div>
      </form>
    </main>
    <script>
      const box = document.querySelector("textarea");
      const send = document.querySelector(".send");
      const count = document.querySelector(".sill-note span:last-child");
      box.addEventListener("input", () => {
        send.disabled = box.value.trim().length === 0;
        count.textContent = box.value.length + "/2000";
      });
    </script>
  </body>
</html>
