user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Request URLs may contain auth reset tokens. Do not log paths or query strings.
    log_format safe '$request_method $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log safe;
    # Nginx error messages may contain request URIs; keep only critical errors.
    error_log /var/log/nginx/error.log crit;
    server_tokens off;
    sendfile on;
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream booksoul_api {
        zone booksoul_api 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server api:3000 resolve;
    }
    server {
        listen 80;
        server_name _;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://booksoul_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Exactly one trusted proxy: replace untrusted forwarded client values.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location = /index.html {
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache';
        }
    }
}
